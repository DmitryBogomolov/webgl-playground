name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    name: Setup, lint, test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v3
      - name: Setup node ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build static content
        run: |
          npm run build-static
          ls ./build/
      - name: Upload artifact
        if: ${{ matrix.node-version == '24.x' }}
        uses: actions/upload-artifact@v4
        with:
          name: static-content
          path: ./build
          overwrite: true

  deploy:
    name: Deploy static
    runs-on: ubuntu-latest
    needs: ci

    environment:
      name: s3-site
      url: ${{ format('{0}/{1}/', vars.BUCKET_URL, env.page_path) }}

    env:
      page_path: >
        ${{
          case(
            github.event_name == 'pull_request',
            format('pr_{0}', github.event.pull_request.number),
            'master'
          )
        }}
      AWS_ENDPOINT_URL: ${{ vars.ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ vars.REGION }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: static-content
          path: ./site

      - name: Debug 1
        run: echo "${{ env.page_path }}"

      - name: Debug 2
        run: echo "s3://${{ vars.BUCKET }}/${{ env.page_path }}/"

    #   - name: Deploy content
    #     run: |
    #       aws s3 rm --recursive "s3://${{ vars.BUCKET }}/${{ env.page_path }}/"
    #       aws s3 cp --recursive ./site "s3://${{ vars.BUCKET }}/${{ env.page_path }}/"

